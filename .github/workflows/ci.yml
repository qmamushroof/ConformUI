name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (biome ci)
        run: npx biome ci
      - name: Typecheck (tsc -b)
        run: npx tsc -b
      - name: Architecture (depcruise + architecture tests)
        run: |
          npm run depcruise
          npx vitest run --project node tests/architecture
      - name: Unit and component tests
        run: npx vitest run
      - name: Build and size check
        run: |
          npx vite build
          node scripts/check-size.mjs
          node scripts/check-dist.mjs
      - run: npx playwright install --with-deps chromium
      - name: Production build smoke
        run: npx playwright test -c playwright.prod.config.ts
      - name: E2E (e2e build + Playwright)
        run: npx playwright test
      - run: npx playwright install --with-deps firefox
      - name: Cross-browser smoke (Chromium, Firefox, Pixel 7)
        run: npx playwright test -c playwright.cross.config.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
