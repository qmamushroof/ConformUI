<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="ConformUI">
  <title>ConformUI</title>
  <!-- Small-size variant of logo.svg for icons rendered below 48px (favicon 16/32).
       Same shapes, redrawn on a 16px grid: stroke 1 (= one device pixel at 16px), coordinates on
       half-pixels so lines are crisp. C spans the canvas; U and I segments are all 4 long, 3 apart.
       U and I sit 0.5px below centre (rows 6.5–10.5, centre 8.5) to stay on the half-pixel grid
       (crisp at 16px). Colour = primary token #2563EB. -->
  <g fill="none" stroke="#2563EB" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M14.5 4.5 V1.5 H1.5 V14.5 H14.5 V11.5"/>
    <path d="M4.5 6.5 V10.5 H8.5 V6.5"/>
    <path d="M11.5 6.5 V10.5"/>
  </g>
</svg>
